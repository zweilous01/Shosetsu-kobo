<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>小説工房</title>
<meta name="theme-color" content="#3b3a36">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#2b2a27; --sub:#7a766c; --line:#e3ddd0;
  --accent:#8a3b2e; --accent-soft:#f1e3dc; --warn:#b5651d; --warn-soft:#fbeedd;
  --head:#3b3a36; --head-ink:#f6f3ec;
  --serif:"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1b19; --paper:#24231f; --ink:#e8e4da; --sub:#9b968a; --line:#36342f;
    --accent:#e08a74; --accent-soft:#3a2924; --warn:#e3a35e; --warn-soft:#3a2e20;
    --head:#141311; --head-ink:#e8e4da;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body.nosel{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5}
header.bar{background:var(--head);color:var(--head-ink);
  display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;min-height:56px}
header.bar h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 0 8px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:20px}
.ibtn:active{background:rgba(255,255,255,.12)}
.ttl{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed rgba(232,228,218,.3);color:var(--head-ink);
  font-family:var(--serif);font-size:17px;padding:8px 4px;outline:none;border-radius:0}
.ttl:focus{border-bottom-color:rgba(232,228,218,.8)}
.ttl::placeholder{color:rgba(232,228,218,.5)}
.status{font-size:12px;opacity:.75;padding:0 4px;white-space:nowrap}
main{flex:1;padding:12px 16px 120px;max-width:760px;width:100%;margin:0 auto}

/* タブ */
nav.tabs{display:flex;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;padding:12px 14px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* バックアップ帯 */
.bk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin:4px 0 14px;
  background:var(--paper);border:1px solid var(--line);font-size:13px;color:var(--sub)}
.bk.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.bk b{flex:1;font-weight:500}
.bk button{padding:6px 10px;border-radius:8px;border:1px solid currentColor;font-size:13px;white-space:nowrap}

.hint{font-size:12px;color:var(--sub);margin:2px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.sec-title{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:18px 4px 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.sortbox{min-height:6px}
.row{display:flex;align-items:center;gap:8px;padding:12px 6px 12px 14px;border-top:1px solid var(--line);min-height:56px;
  background:var(--paper);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.sortbox>.row:first-child,.card>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;text-align:left}
.row .t{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .pv{font-size:13px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.more{width:40px;height:40px;border-radius:50%;color:var(--sub);font-size:20px;flex:none}
.more:active{background:var(--line)}
.chap{margin-bottom:12px}
.chap-head{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;background:var(--accent-soft)}
.grip{width:36px;height:40px;flex:none;display:grid;place-items:center;color:var(--accent);opacity:.6;font-size:18px;touch-action:none;cursor:grab}
.chap-head input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--accent);padding:8px 0}
.chap-head .n{font-size:12px;color:var(--sub);white-space:nowrap}
.add{display:block;width:100%;text-align:left;padding:12px 14px;color:var(--accent);font-size:14px;border-top:1px dashed var(--line)}
.empty{text-align:center;color:var(--sub);padding:40px 16px;font-size:14px;line-height:1.8}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.wide-btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--accent);color:var(--accent);font-size:15px;margin-top:4px}

/* ドラッグ中 */
.dragging{opacity:.3}
.ghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:10px;opacity:.96;transform:scale(1.02)}

/* 人物タグ */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px 2px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:600;font-size:16px}

/* ネタ帳 */
.quick{display:flex;gap:8px;align-items:flex-end;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.quick textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font-size:15px;line-height:1.6;min-height:48px;padding:4px 6px}
.quick button{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;white-space:nowrap}
.used .pv,.used .t{text-decoration:line-through;opacity:.55}

/* 書く画面 */
.editor{height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
textarea.body{flex:1;width:100%;border:0;outline:none;resize:none;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.9;padding:16px 18px 40px;letter-spacing:.02em}
.fields{padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.fields label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px}
.fields input{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:15px;padding:6px 2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);min-height:48px}
.foot .grow{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.fbtn{padding:7px 12px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--ink);white-space:nowrap}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 下から出るメニュー */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));max-height:80dvh;overflow-y:auto}
.sheet h3{font-size:13px;color:var(--sub);font-weight:500;margin:8px 20px 6px}
.sheet button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:15px 20px;font-size:16px}
.sheet button:active{background:var(--line)}
.sheet .danger{color:#c0392b}
.sheet .note{font-size:12px;color:var(--sub);padding:0 20px 8px;line-height:1.6}
.sheet .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;flex:none}
.sheet .chk.on{background:var(--accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90vw}
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
/* ===== 保存庫（スマホの中に保存） ===== */
const DB_NAME = 'shosetsu-kobo', STORE = 'kv';
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbGet(key){
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(STORE).objectStore(STORE).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbSet(key, val){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

/* ===== データ ===== */
let data = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const COLORS = ['#8a3b2e','#c0763a','#b59a2a','#4f7d3a','#2f7a78','#3a5f9a','#6b4a9a','#9a4a7a','#6b6b6b'];
function emptyData(){ return { app:'shosetsu-kobo', version:2, works:[], lastBackupAt:null }; }
function newWork(){
  return { id:uid(), title:'無題の作品', createdAt:now(), updatedAt:now(),
    chapters:[ newChapter('第1章') ], synopsis:'', worldItems:[], ideas:[], characters:[] };
}
function newChapter(title){ return { id:uid(), title, episodes:[] }; }
function newEpisode(title){ return { id:uid(), title, body:'', tags:[], updatedAt:now() }; }

/* 部品「データ引き継ぎ」：古い形のデータ（v1）も今の形にそろえる */
function migrate(d){
  if (!d) return emptyData();
  d.app = 'shosetsu-kobo';
  (d.works || (d.works = [])).forEach(w => {
    w.chapters = w.chapters || [];
    w.chapters.forEach(c => (c.episodes = c.episodes || []).forEach(e => { e.tags = e.tags || []; e.body = e.body || ''; }));
    w.synopsis = w.synopsis || '';
    w.worldItems = w.worldItems || [];
    if (typeof w.world === 'string'){ if (w.world.trim()) w.worldItems.push({ id:uid(), title:'世界観メモ', body:w.world }); delete w.world; }
    w.ideas = (w.ideas || []).map(i => typeof i === 'string' ? { id:uid(), text:i, tags:[], used:false, createdAt:now() } : i);
    w.ideas.forEach(i => { i.tags = i.tags || []; });
    w.characters = w.characters || [];
  });
  d.version = 2;
  return d;
}

let saveTimer = null;
function save(){ return dbSet('data', data).then(() => setStatus('保存済み')).catch(() => setStatus('保存に失敗')); }
function saveSoon(){ setStatus('保存中…'); clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; save(); }, 600); }
function flushSave(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; save(); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);

/* ===== 小道具 ===== */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count = s => (s || '').replace(/\s/g, '').length;
const fmtN = n => n.toLocaleString('ja-JP');
const firstLine = s => (s || '').trim().split('\n')[0];
function fmtDate(t){
  if (!t) return '';
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function allEpisodes(w){ return w.chapters.flatMap(c => c.episodes.map(e => ({ c, e }))); }
function workChars(w){ return allEpisodes(w).reduce((a, x) => a + count(x.e.body), 0); }
function findWork(id){ return data.works.find(w => w.id === id); }
function touch(w){ w.updatedAt = now(); }
function setStatus(t){ const el = document.getElementById('status'); if (el) el.textContent = t; }
function toast(t){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
}
const go = h => { location.hash = h; };
function charOf(w, id){ return w.characters.find(c => c.id === id); }
function tagsHtml(w, ids){
  return (ids || []).map(id => charOf(w, id)).filter(Boolean)
    .map(c => `<span class="tag"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span>`).join('');
}
function autoTitle(list, unit){ return `第${list.length + 1}${unit}`; }

/* 部品「下メニュー」 */
function sheet(title, items, note){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">${title ? `<h3>${esc(title)}</h3>` : ''}${note ? `<div class="note">${esc(note)}</div>` : ''}</div>`;
  const s = bg.firstChild;
  items.filter(Boolean).forEach(it => {
    const b = document.createElement('button'); b.textContent = it.label;
    if (it.danger) b.className = 'danger';
    b.onclick = () => { bg.remove(); it.fn(); };
    s.appendChild(b);
  });
  const c = document.createElement('button'); c.textContent = 'やめる'; c.style.color = 'var(--sub)';
  c.onclick = () => bg.remove(); s.appendChild(c);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

/* 部品「人物タグ選び」：チェックを付けたり外したり */
function tagSheet(w, target, onChange){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const draw = () => {
    bg.innerHTML = `<div class="sheet"><h3>人物タグ</h3>
      ${w.characters.length ? '' : '<div class="note">まだ人物がいません。作品の「人物」タブで追加すると、ここで選べます。</div>'}
      ${w.characters.map(c => `<button data-id="${c.id}"><span class="chk ${target.tags.includes(c.id) ? 'on' : ''}">✓</span>
        <span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}
      <button id="done" style="justify-content:center;color:var(--accent);font-weight:600">完了</button></div>`;
    bg.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      const id = b.dataset.id, i = target.tags.indexOf(id);
      if (i >= 0) target.tags.splice(i, 1); else target.tags.push(id);
      onChange(); draw();
    });
    bg.querySelector('#done').onclick = () => bg.remove();
  };
  draw();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

/* 部品「人物で絞り込み」 */
const filters = {};   // 作品ごとに、選んでいる人物
function chipBar(w){
  if (!w.characters.length) return '';
  const sel = filters[w.id];
  return `<div class="chips">${w.characters.map(c =>
    `<button class="chip ${sel === c.id ? 'on' : ''}" data-chip="${c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div>`;
}
function bindChips(w, rerender){
  $app.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    filters[w.id] = filters[w.id] === b.dataset.chip ? null : b.dataset.chip; rerender();
  });
}

/* ===== 部品「長押し並べ替え」 =====
   行を長押し（約0.4秒）→ 浮き上がる → 指を動かして好きな位置で離す。
   handle を指定すると、その印（≡）に触れた瞬間からつかめる。 */
let suppressClickUntil = 0;
document.addEventListener('click', e => { if (Date.now() < suppressClickUntil){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest('.row,.grip')) e.preventDefault(); });
function sortable(root, { item, box, handle, onEnd }){
  let timer = null, drag = null, sx = 0, sy = 0, lastY = 0, raf = 0;
  const begin = (el, y) => {
    const r = el.getBoundingClientRect();
    const ghost = el.cloneNode(true); ghost.classList.add('ghost');
    Object.assign(ghost.style, { left:r.left + 'px', top:r.top + 'px', width:r.width + 'px' });
    document.body.appendChild(ghost);
    el.classList.add('dragging'); document.body.classList.add('nosel');
    if (navigator.vibrate) navigator.vibrate(25);
    drag = { el, ghost, off: y - r.top }; lastY = y;
    const loop = () => {
      if (!drag) return;
      if (lastY < 90) window.scrollBy(0, -12); else if (lastY > innerHeight - 90) window.scrollBy(0, 12);
      place(lastY); raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  };
  const place = y => {
    drag.ghost.style.top = (y - drag.off) + 'px';
    const boxes = root.matches(box) ? [root] : [...root.querySelectorAll(box)];
    let target = boxes.find(b => { const r = b.getBoundingClientRect(); return y >= r.top && y <= r.bottom; });
    if (!target) target = boxes.reduce((best, b) => {
      const r = b.getBoundingClientRect(), d = Math.min(Math.abs(y - r.top), Math.abs(y - r.bottom));
      return !best || d < best.d ? { b, d } : best;
    }, null)?.b;
    if (!target) return;
    const items = [...target.querySelectorAll(':scope > ' + item)].filter(x => x !== drag.el);
    const before = items.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
    if (before){ if (drag.el.nextSibling !== before) target.insertBefore(drag.el, before); }
    else if (target.lastElementChild !== drag.el) target.appendChild(drag.el);
  };
  const finish = () => {
    cancelAnimationFrame(raf);
    drag.ghost.remove(); drag.el.classList.remove('dragging'); document.body.classList.remove('nosel');
    drag = null; suppressClickUntil = Date.now() + 350; onEnd();
  };
  const down = (e, x, y) => {
    if (e.target.closest('input,textarea,.more')) return false;
    const el = e.target.closest(item); if (!el || !root.contains(el)) return false;
    if (handle){
      if (!e.target.closest(handle)) return false;
      begin(el, y); return true;
    }
    sx = x; sy = y;
    timer = setTimeout(() => { timer = null; begin(el, sy); }, 420);
    return false;
  };
  const moveTo = (x, y) => {
    if (timer && (Math.abs(x - sx) > 8 || Math.abs(y - sy) > 8)){ clearTimeout(timer); timer = null; }
    if (drag){ lastY = y; place(y); return true; }
    return false;
  };
  const up = () => { if (timer){ clearTimeout(timer); timer = null; } if (drag) finish(); };
  root.addEventListener('touchstart', e => { const t = e.touches[0]; if (down(e, t.clientX, t.clientY)) e.preventDefault(); }, { passive:false });
  root.addEventListener('touchmove', e => { const t = e.touches[0]; if (moveTo(t.clientX, t.clientY)) e.preventDefault(); }, { passive:false });
  root.addEventListener('touchend', up); root.addEventListener('touchcancel', up);
  root.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (down(e, e.clientX, e.clientY)) e.preventDefault();
    const mm = ev => moveTo(ev.clientX, ev.clientY);
    const mu = () => { up(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  });
}
// 画面に並んだ順番どおりに、元のリストを並べ直す
function reorderBy(list, ids){ const m = new Map(list.map(x => [x.id, x])); return ids.map(id => m.get(id)).filter(Boolean); }
const idsIn = (el, sel) => [...el.querySelectorAll(sel)].map(x => x.dataset.id);

/* ===== 部品「バックアップ」 ===== */
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function download(name, text, type){
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportBackup(){
  data.lastBackupAt = now();
  download(`小説工房バックアップ_${stamp()}.json`, JSON.stringify(data, null, 1), 'application/json');
  save(); toast('バックアップを書き出しました（ダウンロードフォルダ）'); route();
}
function importBackup(){ document.getElementById('importFile').click(); }
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let incoming;
  try { incoming = JSON.parse(await f.text()); } catch { alert('このファイルは読み込めませんでした。'); return; }
  if (!incoming || incoming.app !== 'shosetsu-kobo' || !Array.isArray(incoming.works)){
    alert('小説工房のバックアップファイルではないようです。'); return;
  }
  const n = incoming.works.length;
  if (!confirm(`バックアップ（作品 ${n} 件）を読み込みます。\n今アプリにあるデータは、このバックアップの内容に置き換わります。\n\n（念のため、置き換える前のデータはアプリ内に1つだけ控えておきます）\n\n読み込みますか？`)) return;
  await dbSet('beforeImport', { savedAt: now(), data });
  data = migrate(incoming); await save();
  toast('読み込みました'); go('#/'); route();
});
async function restoreBeforeImport(){
  const b = await dbGet('beforeImport');
  if (!b){ alert('控えはありません。'); return; }
  if (!confirm(`${fmtDate(b.savedAt)} に控えたデータ（読み込み前の状態）に戻しますか？\n今のデータは置き換わります。`)) return;
  const cur = data; data = migrate(b.data);
  await dbSet('beforeImport', { savedAt: now(), data: cur });
  await save(); toast('読み込み前の状態に戻しました'); route();
}
function exportText(w){
  let t = `${w.title}\n\n`;
  w.chapters.forEach(c => {
    t += `\n■ ${c.title}\n\n`;
    c.episodes.forEach(e => { t += `◆ ${e.title}\n\n${e.body}\n\n`; });
  });
  download(`${w.title}_${stamp()}.txt`, t, 'text/plain');
  toast('テキストで書き出しました');
}
function backupBar(){
  const t = data.lastBackupAt;
  if (!data.works.length && !t) return '';
  let msg, warn = false;
  if (!t){ msg = 'まだバックアップしていません'; warn = true; }
  else {
    const days = Math.floor((now() - t) / 86400000);
    msg = days === 0 ? '今日バックアップ済み' : `最後のバックアップから ${days} 日`;
    warn = days >= 3;
  }
  return `<div class="bk ${warn ? 'warn' : ''}"><b>${msg}</b><button id="bkNow">書き出す</button></div>`;
}

/* ===== 画面「作品一覧」 ===== */
function renderHome(){
  const ws = [...data.works].sort((a, b) => b.updatedAt - a.updatedAt);
  $app.innerHTML = `
    <div class="top"><header class="bar"><h1>小説工房</h1><button class="ibtn" id="menu" aria-label="メニュー">⋮</button></header></div>
    <main>
      ${backupBar()}
      ${ws.length ? `<div class="sec-title">作品</div><div class="card">${ws.map(w => `
        <div class="row">
          <button class="main" data-open="${w.id}">
            <div class="t">${esc(w.title)}</div>
            <div class="m">${fmtN(workChars(w))} 字 ・ ${w.chapters.length} 章 ・ 更新 ${fmtDate(w.updatedAt)}</div>
          </button>
          <button class="more" data-more="${w.id}" aria-label="操作">⋯</button>
        </div>`).join('')}</div>`
      : `<div class="empty">まだ作品がありません。<br>右下の ＋ から作品を作りましょう。</div>`}
    </main>
    <button class="fab" id="addWork" aria-label="作品を追加">＋</button>`;
  $app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => go(`#/w/${b.dataset.open}`));
  $app.querySelectorAll('[data-more]').forEach(b => b.onclick = () => workMenu(findWork(b.dataset.more)));
  document.getElementById('addWork').onclick = () => {
    const w = newWork(); data.works.push(w); save(); go(`#/w/${w.id}`);
  };
  document.getElementById('menu').onclick = () => sheet('メニュー', [
    { label:'バックアップを書き出す', fn:exportBackup },
    { label:'バックアップを読み込む', fn:importBackup },
    { label:'読み込み前の状態に戻す', fn:restoreBeforeImport },
  ], 'バックアップは全作品を1つのファイルにまとめます。こまめに書き出して、Googleドライブなどにも置いておくと安心です。');
  const bk = document.getElementById('bkNow'); if (bk) bk.onclick = exportBackup;
}
function workMenu(w){
  sheet(w.title, [
    { label:'テキストで書き出す（.txt）', fn:() => exportText(w) },
    { label:'作品を削除する', danger:true, fn:() => {
      if (!confirm(`「${w.title}」を削除します。\n本文・人物・ネタもすべて消え、元に戻せません。\n（心配なら先にバックアップを書き出してください）\n\n削除しますか？`)) return;
      data.works = data.works.filter(x => x !== w); save(); route();
    } },
  ]);
}

/* ===== 画面「作品」（タブ：本文・あらすじ・人物・世界観・ネタ帳） ===== */
const TABS = [['body','本文'],['synopsis','あらすじ'],['chars','人物'],['world','世界観'],['ideas','ネタ帳']];
function renderWork(wid, tab){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  tab = TABS.some(t => t[0] === tab) ? tab : 'body';
  $app.innerHTML = `
    <div class="top">
      <header class="bar">
        <button class="ibtn" id="back" aria-label="戻る">←</button>
        <input class="ttl" id="wttl" value="${esc(w.title)}" placeholder="作品のタイトル">
        <span class="status" id="status"></span>
        <button class="ibtn" id="wmenu" aria-label="作品の操作">⋮</button>
      </header>
      <nav class="tabs">${TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</nav>
    </div>
    <main id="pane"></main>`;
  document.getElementById('back').onclick = () => go('#/');
  document.getElementById('wmenu').onclick = () => workMenu(w);
  const ttl = document.getElementById('wttl');
  ttl.addEventListener('input', () => { w.title = ttl.value.trim() || '無題の作品'; touch(w); saveSoon(); });
  $app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(`#/w/${wid}/${b.dataset.tab}`));
  ({ body:paneBody, synopsis:paneSynopsis, chars:paneChars, world:paneWorld, ideas:paneIdeas })[tab](w, document.getElementById('pane'));
}

/* タブ「本文」：章と話 */
function paneBody(w, pane){
  const sel = filters[w.id], selC = sel && charOf(w, sel);
  if (selC){
    const hits = allEpisodes(w).filter(x => x.e.tags.includes(sel));
    pane.innerHTML = `${chipBar(w)}
      <div class="hint"><span>「${esc(selC.name)}」が出る話：${hits.length} 話</span></div>
      <div class="card">${hits.map(({ c, e }) => epRow(w, e, c.title)).join('') || '<div class="empty">タグの付いた話はまだありません</div>'}</div>`;
    bindChips(w, () => paneBody(w, pane)); bindEpRows(w, pane, () => paneBody(w, pane));
    return;
  }
  pane.innerHTML = `${chipBar(w)}
    <div class="hint"><span>合計 ${fmtN(workChars(w))} 字</span><span>長押しで並べ替え</span></div>
    <div id="chaps" class="sortbox">${w.chapters.map(c => `
      <div class="card chap" data-id="${c.id}">
        <div class="chap-head">
          <span class="grip" aria-label="章をつかんで移動">≡</span>
          <input data-ctitle="${c.id}" value="${esc(c.title)}" aria-label="章の名前">
          <span class="n">${c.episodes.length} 話</span>
          <button class="more" data-cmore="${c.id}" aria-label="章の操作">⋯</button>
        </div>
        <div class="sortbox eps" data-cid="${c.id}">${c.episodes.map(e => epRow(w, e)).join('')}</div>
        <button class="add" data-addep="${c.id}">＋ 話を追加</button>
      </div>`).join('')}</div>
    <button class="wide-btn" id="addChap">＋ 章を追加</button>`;
  bindChips(w, () => paneBody(w, pane));
  bindEpRows(w, pane, () => paneBody(w, pane));
  document.getElementById('addChap').onclick = () => {
    w.chapters.push(newChapter(autoTitle(w.chapters, '章'))); touch(w); save(); paneBody(w, pane);
  };
  pane.querySelectorAll('[data-ctitle]').forEach(inp => inp.addEventListener('input', () => {
    const c = w.chapters.find(x => x.id === inp.dataset.ctitle); c.title = inp.value || '無題の章'; touch(w); saveSoon();
  }));
  pane.querySelectorAll('[data-addep]').forEach(b => b.onclick = () => {
    const c = w.chapters.find(x => x.id === b.dataset.addep);
    const e = newEpisode(autoTitle(c.episodes, '話')); c.episodes.push(e); touch(w); save();
    go(`#/e/${w.id}/${e.id}`);
  });
  pane.querySelectorAll('[data-cmore]').forEach(b => b.onclick = () => {
    const c = w.chapters.find(x => x.id === b.dataset.cmore);
    sheet(c.title, [
      { label:'章を削除する', danger:true, fn:() => {
        if (c.episodes.length){ alert('話が入っている章は削除できません。\n先に中の話を削除するか、長押しで別の章へ移してください。'); return; }
        if (!confirm(`「${c.title}」を削除しますか？`)) return;
        w.chapters = w.chapters.filter(x => x !== c); touch(w); save(); paneBody(w, pane);
      } },
    ]);
  });
  // 話の並べ替え（章をまたいでもOK）
  const chaps = document.getElementById('chaps');
  sortable(chaps, { item:'.row', box:'.eps', onEnd:() => {
    const all = new Map(allEpisodes(w).map(x => [x.e.id, x.e]));
    chaps.querySelectorAll('.eps').forEach(bx => {
      const c = w.chapters.find(x => x.id === bx.dataset.cid);
      c.episodes = idsIn(bx, ':scope > .row').map(id => all.get(id)).filter(Boolean);
    });
    touch(w); save(); paneBody(w, pane);
  }});
  // 章の並べ替え（≡ をつかむ）
  sortable(chaps, { item:'.chap', box:'#chaps', handle:'.grip', onEnd:() => {
    w.chapters = reorderBy(w.chapters, idsIn(chaps, ':scope > .chap')); touch(w); save(); paneBody(w, pane);
  }});
}
function epRow(w, e, chapName){
  return `<div class="row" data-id="${e.id}">
    <button class="main" data-ep="${e.id}">
      <div class="t">${esc(e.title)}</div>
      <div class="m">${chapName ? `<span>${esc(chapName)}</span>` : ''}<span>${fmtN(count(e.body))} 字 ・ ${fmtDate(e.updatedAt)}</span>${tagsHtml(w, e.tags)}</div>
    </button>
    <button class="more" data-emore="${e.id}" aria-label="話の操作">⋯</button>
  </div>`;
}
function bindEpRows(w, pane, rerender){
  pane.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => go(`#/e/${w.id}/${b.dataset.ep}`));
  pane.querySelectorAll('[data-emore]').forEach(b => b.onclick = () => episodeMenu(w, b.dataset.emore, rerender));
}
function episodeMenu(w, eid, after){
  const x = allEpisodes(w).find(x => x.e.id === eid); if (!x) return;
  sheet(x.e.title, [
    { label:'人物タグを付ける', fn:() => tagSheet(w, x.e, () => { touch(w); save(); after(); }) },
    { label:'話を削除する', danger:true, fn:() => {
      if (!confirm(`「${x.e.title}」を削除します。\n本文も消え、元に戻せません。\n\n削除しますか？`)) return;
      x.c.episodes = x.c.episodes.filter(e => e !== x.e); touch(w); save();
      if (location.hash.startsWith('#/e/')) go(`#/w/${w.id}/body`); else after();
    } },
  ]);
}

/* タブ「あらすじ」 */
function paneSynopsis(w, pane){
  pane.style.padding = '0'; pane.style.display = 'flex';
  pane.innerHTML = `<textarea class="body" id="syn" placeholder="物語全体のあらすじ、テーマ、結末の予定などを自由に書けます" style="min-height:calc(100dvh - 110px)">${esc(w.synopsis)}</textarea>`;
  const t = document.getElementById('syn');
  t.addEventListener('input', () => { w.synopsis = t.value; touch(w); saveSoon(); });
}

/* タブ「人物」 */
function paneChars(w, pane){
  const epCount = id => allEpisodes(w).filter(x => x.e.tags.includes(id)).length;
  const ideaCount = id => w.ideas.filter(i => i.tags.includes(id)).length;
  pane.innerHTML = w.characters.length ? `
    <div class="hint"><span>${w.characters.length} 人</span><span>長押しで並べ替え</span></div>
    <div class="card"><div class="sortbox" id="clist">${w.characters.map(c => `
      <div class="row" data-id="${c.id}">
        <span class="avatar" style="background:${c.color}">${esc((c.name || '？')[0])}</span>
        <button class="main" data-c="${c.id}">
          <div class="t">${esc(c.name)}</div>
          <div class="m">${c.role ? `<span>${esc(c.role)}</span>` : ''}<span>登場 ${epCount(c.id)} 話 ・ ネタ ${ideaCount(c.id)}</span></div>
        </button>
      </div>`).join('')}</div></div>`
    : `<div class="empty">登場人物を追加すると、<br>その人物を話やネタに「タグ」として付けられます。</div>`;
  pane.insertAdjacentHTML('beforeend', `<button class="fab" id="addChar" aria-label="人物を追加">＋</button>`);
  pane.querySelectorAll('[data-c]').forEach(b => b.onclick = () => go(`#/c/${w.id}/${b.dataset.c}`));
  document.getElementById('addChar').onclick = () => {
    const c = { id:uid(), name:'新しい人物', role:'', color:COLORS[w.characters.length % COLORS.length], body:'' };
    w.characters.push(c); touch(w); save(); go(`#/c/${w.id}/${c.id}?new`);
  };
  const cl = document.getElementById('clist');
  if (cl) sortable(cl, { item:'.row', box:'#clist', onEnd:() => { w.characters = reorderBy(w.characters, idsIn(cl, ':scope > .row')); touch(w); save(); paneChars(w, pane); } });
}

/* タブ「世界観」 */
function paneWorld(w, pane){
  pane.innerHTML = w.worldItems.length ? `
    <div class="hint"><span>${w.worldItems.length} 項目</span><span>長押しで並べ替え</span></div>
    <div class="card"><div class="sortbox" id="xlist">${w.worldItems.map(x => `
      <div class="row" data-id="${x.id}">
        <button class="main" data-x="${x.id}">
          <div class="t">${esc(x.title)}</div>
          ${x.body ? `<div class="pv">${esc(x.body.trim().slice(0, 120))}</div>` : ''}
        </button>
      </div>`).join('')}</div></div>`
    : `<div class="empty">地名・組織・魔法のルール・年表など、<br>設定を項目ごとにまとめておけます。</div>`;
  pane.insertAdjacentHTML('beforeend', `<button class="fab" id="addX" aria-label="項目を追加">＋</button>`);
  pane.querySelectorAll('[data-x]').forEach(b => b.onclick = () => go(`#/x/${w.id}/${b.dataset.x}`));
  document.getElementById('addX').onclick = () => {
    const x = { id:uid(), title:'新しい項目', body:'' }; w.worldItems.push(x); touch(w); save(); go(`#/x/${w.id}/${x.id}?new`);
  };
  const xl = document.getElementById('xlist');
  if (xl) sortable(xl, { item:'.row', box:'#xlist', onEnd:() => { w.worldItems = reorderBy(w.worldItems, idsIn(xl, ':scope > .row')); touch(w); save(); paneWorld(w, pane); } });
}

/* タブ「ネタ帳」 */
let hideUsed = false;
function paneIdeas(w, pane){
  const sel = filters[w.id] && charOf(w, filters[w.id]) ? filters[w.id] : null;
  let list = w.ideas;
  if (sel) list = list.filter(i => i.tags.includes(sel));
  if (hideUsed) list = list.filter(i => !i.used);
  const canSort = !sel && !hideUsed;
  pane.innerHTML = `
    <div class="quick"><textarea id="qtext" rows="2" placeholder="思いついたことをすぐメモ（例：終盤であの人物が裏切る）"></textarea><button id="qadd">追加</button></div>
    ${chipBar(w)}
    <div class="hint"><span>${list.length} 件${sel ? `（「${esc(charOf(w, sel).name)}」のタグ）` : ''}</span>
      <button id="hideUsed" style="color:var(--accent);font-size:12px">${hideUsed ? '使ったネタも表示' : '使ったネタを隠す'}</button></div>
    ${list.length ? `<div class="card"><div class="sortbox" id="ilist">${list.map(i => `
      <div class="row ${i.used ? 'used' : ''}" data-id="${i.id}">
        <button class="main" data-i="${i.id}">
          <div class="pv" style="color:var(--ink);font-size:15px;margin-top:0;-webkit-line-clamp:3">${esc(i.text.trim()) || '（空のメモ）'}</div>
          <div class="m">${i.used ? '<span>✓ 使った</span>' : ''}<span>${fmtDate(i.createdAt)}</span>${tagsHtml(w, i.tags)}</div>
        </button>
      </div>`).join('')}</div></div>`
    : `<div class="empty">${sel || hideUsed ? '当てはまるネタはありません' : '「未来のこの話でこうしたい」などを、<br>ここにどんどん放り込めます。'}</div>`}`;
  const q = document.getElementById('qtext');
  document.getElementById('qadd').onclick = () => {
    const t = q.value.trim(); if (!t) { q.focus(); return; }
    w.ideas.unshift({ id:uid(), text:t, tags: sel ? [sel] : [], used:false, createdAt:now() });
    touch(w); save(); paneIdeas(w, pane); toast('ネタを追加しました');
  };
  document.getElementById('hideUsed').onclick = () => { hideUsed = !hideUsed; paneIdeas(w, pane); };
  bindChips(w, () => paneIdeas(w, pane));
  pane.querySelectorAll('[data-i]').forEach(b => b.onclick = () => go(`#/i/${w.id}/${b.dataset.i}`));
  const il = document.getElementById('ilist');
  if (il && canSort) sortable(il, { item:'.row', box:'#ilist', onEnd:() => { w.ideas = reorderBy(w.ideas, idsIn(il, ':scope > .row')); touch(w); save(); paneIdeas(w, pane); } });
}

/* ===== 書く画面（話・人物・世界観・ネタ 共通の部品「書く画面」） ===== */
function editorShell({ back, title, titlePh, fields, bodyText, bodyPh, foot }){
  $app.innerHTML = `
    <div class="editor">
      <header class="bar">
        <button class="ibtn" id="back" aria-label="戻る">←</button>
        ${title === null ? '<h1 style="font-size:16px">ネタ</h1>' : `<input class="ttl" id="ttl" value="${esc(title)}" placeholder="${titlePh}">`}
        <span class="status" id="status">保存済み</span>
        <button class="ibtn" id="emenu" aria-label="操作">⋮</button>
      </header>
      ${fields || ''}
      <textarea class="body" id="body" placeholder="${bodyPh}" spellcheck="false">${esc(bodyText)}</textarea>
      <div class="foot">${foot}</div>
    </div>`;
  document.getElementById('back').onclick = () => { flushSave(); go(back); };
  return { body:document.getElementById('body'), ttl:document.getElementById('ttl'), menu:document.getElementById('emenu') };
}
function selectAllIfNew(inp){ if (inp && location.hash.endsWith('?new')){ inp.focus(); inp.select(); history.replaceState(null, '', location.hash.replace('?new', '')); } }

/* 画面「本文」 */
function renderEpisode(wid, eid){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const x = allEpisodes(w).find(x => x.e.id === eid); if (!x){ go(`#/w/${wid}/body`); return; }
  const ep = x.e;
  const footHtml = () => `<button class="fbtn" id="tagBtn">👤 人物${ep.tags.length ? ` ${ep.tags.length}` : ''}</button>
    <div class="grow">${tagsHtml(w, ep.tags)}</div><span id="cnt"></span>`;
  const { body, ttl, menu } = editorShell({ back:`#/w/${wid}/body`, title:ep.title, titlePh:'話のタイトル',
    bodyText:ep.body, bodyPh:'ここに本文を書きます', foot:footHtml() });
  const foot = document.querySelector('.foot');
  const upd = () => { const c = document.getElementById('cnt'); if (c) c.textContent = `${fmtN(count(body.value))} 字`; };
  const bindFoot = () => { document.getElementById('tagBtn').onclick = () => tagSheet(w, ep, () => { touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); upd(); }); };
  bindFoot(); upd();
  body.addEventListener('input', () => { ep.body = body.value; ep.updatedAt = now(); touch(w); upd(); saveSoon(); });
  ttl.addEventListener('input', () => { ep.title = ttl.value.trim() || '無題'; ep.updatedAt = now(); touch(w); saveSoon(); });
  menu.onclick = () => episodeMenu(w, ep.id, () => { foot.innerHTML = footHtml(); bindFoot(); upd(); });
  if (!ep.body) body.focus();
}

/* 画面「人物」 */
function renderCharacter(wid, cid){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const c = charOf(w, cid); if (!c){ go(`#/w/${wid}/chars`); return; }
  const eps = allEpisodes(w).filter(x => x.e.tags.includes(c.id));
  const ideas = w.ideas.filter(i => i.tags.includes(c.id));
  const { body, ttl, menu } = editorShell({ back:`#/w/${wid}/chars`, title:c.name, titlePh:'名前',
    fields:`<div class="fields">
      <label>役割など<input id="role" value="${esc(c.role)}" placeholder="例：主人公／探索者／敵の幹部"></label>
      <label>色<span class="swatches">${COLORS.map(k => `<button class="sw ${k === c.color ? 'on' : ''}" data-col="${k}" style="background:${k}" aria-label="色"></button>`).join('')}</span></label>
    </div>`,
    bodyText:c.body, bodyPh:'見た目、性格、口調、過去、ほかの人物との関係など、細かい設定を自由に',
    foot:`<button class="fbtn" id="seeEps">登場する話 ${eps.length}</button><button class="fbtn" id="seeIdeas">ネタ ${ideas.length}</button>` });
  selectAllIfNew(ttl);
  body.addEventListener('input', () => { c.body = body.value; touch(w); saveSoon(); });
  ttl.addEventListener('input', () => { c.name = ttl.value.trim() || '名前なし'; touch(w); saveSoon(); });
  const role = document.getElementById('role');
  role.addEventListener('input', () => { c.role = role.value; touch(w); saveSoon(); });
  document.querySelectorAll('[data-col]').forEach(b => b.onclick = () => {
    c.color = b.dataset.col; touch(w); save();
    document.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('seeEps').onclick = () => {
    if (!eps.length){ toast('まだこの人物のタグが付いた話はありません'); return; }
    sheet(`「${c.name}」が出る話`, eps.map(({ c:ch, e }) => ({ label:`${ch.title}　${e.title}`, fn:() => go(`#/e/${wid}/${e.id}`) })));
  };
  document.getElementById('seeIdeas').onclick = () => { filters[wid] = c.id; go(`#/w/${wid}/ideas`); };
  menu.onclick = () => sheet(c.name, [
    { label:'この人物で本文を絞り込む', fn:() => { filters[wid] = c.id; go(`#/w/${wid}/body`); } },
    { label:'人物を削除する', danger:true, fn:() => {
      if (!confirm(`「${c.name}」を削除します。\n設定メモは消え、話やネタに付いたこの人物のタグも外れます。元に戻せません。\n\n削除しますか？`)) return;
      w.characters = w.characters.filter(x => x !== c);
      allEpisodes(w).forEach(x => x.e.tags = x.e.tags.filter(t => t !== c.id));
      w.ideas.forEach(i => i.tags = i.tags.filter(t => t !== c.id));
      if (filters[wid] === c.id) filters[wid] = null;
      touch(w); save(); go(`#/w/${wid}/chars`);
    } },
  ]);
}

/* 画面「世界観の項目」 */
function renderWorldItem(wid, xid){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const x = w.worldItems.find(x => x.id === xid); if (!x){ go(`#/w/${wid}/world`); return; }
  const { body, ttl, menu } = editorShell({ back:`#/w/${wid}/world`, title:x.title, titlePh:'項目名',
    bodyText:x.body, bodyPh:'設定の中身を自由に', foot:'<span class="grow"></span><span id="cnt"></span>' });
  selectAllIfNew(ttl);
  const upd = () => document.getElementById('cnt').textContent = `${fmtN(count(body.value))} 字`; upd();
  body.addEventListener('input', () => { x.body = body.value; touch(w); upd(); saveSoon(); });
  ttl.addEventListener('input', () => { x.title = ttl.value.trim() || '無題の項目'; touch(w); saveSoon(); });
  menu.onclick = () => sheet(x.title, [{ label:'項目を削除する', danger:true, fn:() => {
    if (!confirm(`「${x.title}」を削除します。元に戻せません。\n\n削除しますか？`)) return;
    w.worldItems = w.worldItems.filter(y => y !== x); touch(w); save(); go(`#/w/${wid}/world`);
  } }]);
}

/* 画面「ネタ」 */
function renderIdea(wid, iid){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const it = w.ideas.find(i => i.id === iid); if (!it){ go(`#/w/${wid}/ideas`); return; }
  const footHtml = () => `<button class="fbtn" id="tagBtn">👤 人物${it.tags.length ? ` ${it.tags.length}` : ''}</button>
    <div class="grow">${tagsHtml(w, it.tags)}</div><button class="fbtn ${it.used ? 'on' : ''}" id="usedBtn">${it.used ? '✓ 使った' : '使った'}</button>`;
  const { body, menu } = editorShell({ back:`#/w/${wid}/ideas`, title:null, bodyText:it.text, bodyPh:'ネタの中身', foot:footHtml() });
  const foot = document.querySelector('.foot');
  const bindFoot = () => {
    document.getElementById('tagBtn').onclick = () => tagSheet(w, it, () => { touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); });
    document.getElementById('usedBtn').onclick = () => { it.used = !it.used; touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); };
  };
  bindFoot();
  body.addEventListener('input', () => { it.text = body.value; touch(w); saveSoon(); });
  menu.onclick = () => sheet('ネタ', [{ label:'ネタを削除する', danger:true, fn:() => {
    if (!confirm('このネタを削除します。元に戻せません。\n\n削除しますか？')) return;
    w.ideas = w.ideas.filter(y => y !== it); touch(w); save(); go(`#/w/${wid}/ideas`);
  } }]);
}

/* ===== 画面の切り替え（スマホの「戻る」でも戻れる） ===== */
function route(){
  flushSave();
  document.querySelectorAll('.sheet-bg,.ghost').forEach(x => x.remove());
  const p = location.hash.replace(/^#\/?/, '').replace(/\?.*$/, '').split('/');
  if (p[0] === 'w' && p[1]) { renderWork(p[1], p[2]); window.scrollTo(0, 0); }
  else if (p[0] === 'e' && p[2]) renderEpisode(p[1], p[2]);
  else if (p[0] === 'c' && p[2]) renderCharacter(p[1], p[2]);
  else if (p[0] === 'x' && p[2]) renderWorldItem(p[1], p[2]);
  else if (p[0] === 'i' && p[2]) renderIdea(p[1], p[2]);
  else renderHome();
}
window.addEventListener('hashchange', route);

(async () => {
  try { data = await dbGet('data'); } catch (e) { alert('データを読み込めませんでした：' + e); }
  const wasOld = data && data.version !== 2;
  data = migrate(data);
  if (wasOld) await save();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  route();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
