<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>小説工房</title>
<meta name="theme-color" content="#3b3a36">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#2b2a27; --sub:#7a766c; --line:#e3ddd0;
  --accent:#8a3b2e; --accent-soft:#f1e3dc; --warn:#b5651d; --warn-soft:#fbeedd; --danger:#c0392b;
  --head:#3b3a36; --head-ink:#f6f3ec;
  --serif:"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1b19; --paper:#24231f; --ink:#e8e4da; --sub:#9b968a; --line:#36342f;
    --accent:#e08a74; --accent-soft:#3a2924; --warn:#e3a35e; --warn-soft:#3a2e20; --danger:#ff7b6b;
    --head:#141311; --head-ink:#e8e4da;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior-x:none}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body.nosel{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.app{min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5}
header.bar{background:var(--head);color:var(--head-ink);
  display:flex;align-items:center;gap:0;padding:calc(env(safe-area-inset-top) + 6px) 4px 6px;min-height:56px}
header.bar h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 0 10px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.ibtn{width:40px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:20px}
.ibtn:active{background:rgba(255,255,255,.12)}
.ttl{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed rgba(232,228,218,.3);color:var(--head-ink);
  font-family:var(--serif);font-size:17px;padding:8px 4px;outline:none;border-radius:0}
.ttl:focus{border-bottom-color:rgba(232,228,218,.8)}
.ttl::placeholder{color:rgba(232,228,218,.5)}
.status{font-size:13px;opacity:.6;width:16px;text-align:center;flex:none}
main{flex:1;padding:12px 16px 120px;max-width:760px;width:100%;margin:0 auto}

/* タブ（今いるタブは枠で囲む） */
nav.tabs{position:relative;display:flex;gap:4px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding:6px 6px}
nav.tabs button{position:relative;z-index:1;flex:1 0 auto;padding:8px 10px;font-size:14px;color:var(--sub);border:1.5px solid transparent;border-radius:10px;white-space:nowrap;transition:color .2s}
nav.tabs button.on{color:var(--accent);font-weight:700}
/* 部品「タブの枠」：枠そのものが横にスライドして移動する */
.tab-ind{position:absolute;z-index:0;top:6px;bottom:6px;left:0;width:0;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;pointer-events:none}
.tab-ind.anim{transition:transform .26s cubic-bezier(.2,.7,.3,1),width .26s cubic-bezier(.2,.7,.3,1)}

/* バックアップ帯 */
.bk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;margin:4px 0 14px;
  background:var(--paper);border:1px solid var(--line);font-size:13px;color:var(--sub)}
.bk.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.bk b{flex:1;font-weight:500}
.bk button{padding:6px 10px;border-radius:8px;border:1px solid currentColor;font-size:13px;white-space:nowrap}

.hint{font-size:12px;color:var(--sub);margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint .link{color:var(--accent);font-size:12px}
.sec-title{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:18px 4px 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.sortbox{min-height:6px}
.row{display:flex;align-items:center;gap:2px;padding:10px 4px 10px 14px;border-top:1px solid var(--line);min-height:56px;
  background:var(--paper);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.sortbox>.row:first-child,.card>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;text-align:left;padding-right:4px}
.row .t{font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .pv{font-size:13px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.act{width:40px;height:40px;border-radius:50%;color:var(--sub);flex:none;display:grid;place-items:center}
.act:active{background:var(--line)}
/* 部品「2回押し削除」：1回目で赤い「削除」に変わる */
.del.armed{width:auto;padding:0 12px;border-radius:20px;background:var(--danger);color:#fff;font-size:13px;font-weight:600}
header .del.armed{background:var(--danger)}
.chap{margin-bottom:12px}
.chap-head{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 4px;background:var(--accent-soft)}
.grip{width:36px;height:40px;flex:none;display:grid;place-items:center;color:var(--accent);opacity:.6;font-size:18px;touch-action:none;cursor:grab}
.chap-head input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-family:var(--serif);font-weight:600;font-size:15px;color:var(--accent);padding:8px 0}
.chap-head .n{font-size:12px;color:var(--sub);white-space:nowrap}
.add{display:block;width:100%;text-align:left;padding:12px 14px;color:var(--accent);font-size:14px;border-top:1px dashed var(--line)}
.empty{text-align:center;color:var(--sub);padding:40px 16px;font-size:14px;line-height:1.8}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.wide-btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px dashed var(--accent);color:var(--accent);font-size:15px;margin-top:4px}
.grp{font-size:12px;color:var(--sub);padding:8px 14px;background:var(--bg);border-top:1px solid var(--line);letter-spacing:.05em}
.card>.grp:first-child{border-top:0}

/* ドラッグ中 */
.dragging{opacity:.3}
.ghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:10px;opacity:.96;transform:scale(1.02)}

/* タグ（人物は丸、世界観は四角） */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.sq{border-radius:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px 2px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
.chip.clear{color:var(--accent);border-style:dashed}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:600;font-size:16px}
.avatar.sq{border-radius:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff}

/* ネタ帳 */
.quick{display:flex;gap:8px;align-items:flex-end;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.quick textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font-size:15px;line-height:1.6;min-height:48px;padding:4px 6px}
.quick button{background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;white-space:nowrap}
.used .pv,.used .t{text-decoration:line-through;opacity:.55}

/* 書く画面 */
.editor{height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
textarea.body{flex:1;width:100%;border:0;outline:none;resize:none;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.9;padding:16px 18px 40px;letter-spacing:.02em}
.fields{padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.fields label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:10px}
.fields input{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:15px;padding:6px 2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);min-height:48px}
.foot .grow{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.fbtn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--ink);white-space:nowrap;flex:none}
.fbtn svg.i{width:15px;height:15px}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 下から出るメニュー */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom));max-height:80dvh;overflow-y:auto}
.sheet h3{font-size:13px;color:var(--sub);font-weight:500;margin:8px 20px 6px}
.sheet h4{font-size:12px;color:var(--sub);font-weight:500;margin:10px 20px 2px;letter-spacing:.1em}
.sheet button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 20px;font-size:16px}
.sheet button:active{background:var(--line)}
.sheet button.on{color:var(--accent);font-weight:700}
.sheet .note{font-size:12px;color:var(--sub);padding:0 20px 8px;line-height:1.6}
.sheet .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;flex:none}
.sheet .chk.on{background:var(--accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
/* ===== アイコン ===== */
const I = {
  undo:'<svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  redo:'<svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>',
  tag:'<svg class="i" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  dl:'<svg class="i" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>',
  page:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>',
  idea:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  menu:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>',
};

/* ===== 保存庫（スマホの中に保存） ===== */
const DB_NAME = 'shosetsu-kobo', STORE = 'kv';
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbGet(key){
  const db = await openDB();
  return new Promise((res, rej) => {
    const r = db.transaction(STORE).objectStore(STORE).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function dbSet(key, val){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

/* ===== データ ===== */
let data = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const COLORS = ['#8a3b2e','#c0763a','#b59a2a','#4f7d3a','#2f7a78','#3a5f9a','#6b4a9a','#9a4a7a','#6b6b6b'];
function emptyData(){ return { app:'shosetsu-kobo', version:4, works:[], lastBackupAt:null }; }
function newWork(){
  return { id:uid(), title:'無題の作品', createdAt:now(), updatedAt:now(),
    chapters:[ newChapter('第1章') ], synopsis:'', worldItems:[], ideas:[], characters:[] };
}
function newChapter(title){ return { id:uid(), title, episodes:[] }; }
function newEpisode(title){ return { id:uid(), title, body:'', tags:[], updatedAt:now() }; }

/* 部品「データ引き継ぎ」：古い形のデータ（v1・v2）も今の形にそろえる */
function migrate(d){
  if (!d) return emptyData();
  d.app = 'shosetsu-kobo';
  (d.works || (d.works = [])).forEach(w => {
    w.chapters = w.chapters || [];
    w.chapters.forEach(c => (c.episodes = c.episodes || []).forEach(e => { e.tags = e.tags || []; e.body = e.body || ''; }));
    w.synopsis = w.synopsis || '';
    w.worldItems = w.worldItems || [];
    if (typeof w.world === 'string'){ if (w.world.trim()) w.worldItems.push({ id:uid(), title:'世界観メモ', body:w.world }); delete w.world; }
    w.worldItems.forEach((x, k) => { x.cat = x.cat || ''; x.color = x.color || COLORS[(k + 4) % COLORS.length]; x.body = x.body || ''; });
    w.ideas = (w.ideas || []).map(i => typeof i === 'string' ? { id:uid(), text:i, tags:[], used:false, createdAt:now() } : i);
    w.ideas.forEach(i => { i.tags = i.tags || []; i.epIds = i.epIds || (i.epId ? [i.epId] : []); delete i.epId; });
    w.characters = w.characters || [];
  });
  d.version = 4;
  return d;
}

let saveTimer = null;
function save(){ return dbSet('data', data).then(() => setStatus('✓')).catch(() => setStatus('!')); }
function saveSoon(){ setStatus('…'); clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; save(); }, 600); }
function flushSave(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; save(); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);

let lastHash = null;
/* ===== 部品「戻る・進む」 =====
   変更の直前の状態を控えておき、↶で1つ戻す・↷で1つ進める。
   文字入力は、続けて打っている間はまとめて1つ扱い（2.5秒手が止まったら区切り）。
   ※アプリを閉じると履歴は消える（仮） */
let undoStack = [], redoStack = [], lastGroup = null, lastT = 0;
function clone(v){ // 文字列は共有するので、長い本文でもメモリをほとんど使わない
  if (Array.isArray(v)) return v.map(clone);
  if (v && typeof v === 'object'){ const o = {}; for (const k in v) o[k] = clone(v[k]); return o; }
  return v;
}
function rec(group){
  const t = now();
  if (group && group === lastGroup && t - lastT < 2500){ lastT = t; return; }
  undoStack.push(clone(data)); if (undoStack.length > 100) undoStack.shift();
  redoStack = []; lastGroup = group || null; lastT = t; updUndo();
}
function undo(){
  flushSave(); if (!undoStack.length) return;
  const keep = data.lastBackupAt;
  redoStack.push(clone(data)); data = undoStack.pop(); data.lastBackupAt = keep;
  lastGroup = null; save(); route(true); toast('1つ戻しました');
}
function redo(){
  flushSave(); if (!redoStack.length) return;
  const keep = data.lastBackupAt;
  undoStack.push(clone(data)); data = redoStack.pop(); data.lastBackupAt = keep;
  lastGroup = null; save(); route(true); toast('1つ進めました');
}
function updUndo(){
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if (u) u.disabled = !undoStack.length; if (r) r.disabled = !redoStack.length;
}
const undoBtns = () => `<button class="ibtn" id="undoBtn" aria-label="1つ戻る">${I.undo}</button><button class="ibtn" id="redoBtn" aria-label="1つ進む">${I.redo}</button>`;
function bindUndo(){
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if (u) u.onclick = undo; if (r) r.onclick = redo; updUndo();
}

/* ===== 小道具 ===== */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count = s => (s || '').replace(/\s/g, '').length;
const fmtN = n => n.toLocaleString('ja-JP');
function fmtDate(t){
  if (!t) return '';
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function allEpisodes(w){ return w.chapters.flatMap(c => c.episodes.map(e => ({ c, e }))); }
function findEp(w, id){ return allEpisodes(w).find(x => x.e.id === id); }
function workChars(w){ return allEpisodes(w).reduce((a, x) => a + count(x.e.body), 0); }
function findWork(id){ return data.works.find(w => w.id === id); }
function touch(w){ w.updatedAt = now(); }
function setStatus(t){ const el = document.getElementById('status'); if (el) el.textContent = t; }
function toast(t){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
}
const go = h => { location.hash = h; };
function charOf(w, id){ return w.characters.find(c => c.id === id); }
/* タグ＝人物 または 世界観の項目 */
function tagOf(w, id){
  const c = charOf(w, id); if (c) return { id, name:c.name, color:c.color, sq:false };
  const x = w.worldItems.find(x => x.id === id); if (x) return { id, name:x.title, color:x.color, sq:true };
  return null;
}
const dotHtml = t => `<span class="dot ${t.sq ? 'sq' : ''}" style="background:${t.color}"></span>`;
function tagsHtml(w, ids){
  return (ids || []).map(id => tagOf(w, id)).filter(Boolean).map(t => `<span class="tag">${dotHtml(t)}${esc(t.name)}</span>`).join('');
}
function autoTitle(list, unit){ return `第${list.length + 1}${unit}`; }
function epLabel(w, ids){
  const xs = (ids || []).map(id => findEp(w, id)).filter(Boolean);
  if (!xs.length) return '';
  return `${xs[0].c.title} ${xs[0].e.title}` + (xs.length > 1 ? ` 他${xs.length - 1}話` : '');
}

/* 部品「2回押し削除」：1回目で赤い「削除」に変わり、3秒以内にもう1回押すと削除 */
const delBtn = attr => `<button class="act del" ${attr} aria-label="削除">${I.x}</button>`;
function twoTap(btn, fn){
  btn.onclick = e => {
    e.stopPropagation();

/* ===== 部品「長押し並べ替え」 =====
   行を長押し（約0.4秒）→ 浮き上がる → 指を動かして好きな位置で離す。
   handle を指定すると、その印（≡）に触れた瞬間からつかめる。 */
let suppressClickUntil = 0, dragging = false;
document.addEventListener('click', e => { if (Date.now() < suppressClickUntil){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest('.row,.grip')) e.preventDefault(); });
function sortable(root, { item, box, handle, onEnd }){
  let timer = null, drag = null, sx = 0, sy = 0, lastY = 0, raf = 0;
  const begin = (el, y) => {
    const r = el.getBoundingClientRect();
    const ghost = el.cloneNode(true); ghost.classList.add('ghost');
    Object.assign(ghost.style, { left:r.left + 'px', top:r.top + 'px', width:r.width + 'px' });
    document.body.appendChild(ghost);
    el.classList.add('dragging'); document.body.classList.add('nosel');
    if (navigator.vibrate) navigator.vibrate(25);
    drag = { el, ghost, off: y - r.top }; lastY = y; dragging = true;
    const loop = () => {
      if (!drag) return;
      if (lastY < 90) window.scrollBy(0, -12); else if (lastY > innerHeight - 90) window.scrollBy(0, 12);
      place(lastY); raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  };
  const place = y => {
    drag.ghost.style.top = (y - drag.off) + 'px';
    const boxes = root.matches(box) ? [root] : [...root.querySelectorAll(box)];
    let target = boxes.find(b => { const r = b.getBoundingClientRect(); return y >= r.top && y <= r.bottom; });
    if (!target) target = boxes.reduce((best, b) => {
      const r = b.getBoundingClientRect(), d = Math.min(Math.abs(y - r.top), Math.abs(y - r.bottom));
      return !best || d < best.d ? { b, d } : best;
    }, null)?.b;
    if (!target) return;
    const items = [...target.querySelectorAll(':scope > ' + item)].filter(x => x !== drag.el);
    const before = items.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
    if (before){ if (drag.el.nextSibling !== before) target.insertBefore(drag.el, before); }
    else if (target.lastElementChild !== drag.el) target.appendChild(drag.el);
  };
  const finish = () => {
    cancelAnimationFrame(raf);
    drag.ghost.remove(); drag.el.classList.remove('dragging'); document.body.classList.remove('nosel');
    drag = null; suppressClickUntil = Date.now() + 350; rec(); onEnd();
    setTimeout(() => { dragging = false; }, 50);
  };
  const down = (e, x, y) => {
    if (e.target.closest('input,textarea,.act')) return false;
    const el = e.target.closest(item); if (!el || !root.contains(el)) return false;
    if (handle){
      if (!e.target.closest(handle)) return false;
      begin(el, y); return true;
    }
    sx = x; sy = y;
    timer = setTimeout(() => { timer = null; begin(el, sy); }, 420);
    return false;
  };
  const moveTo = (x, y) => {
    if (timer && (Math.abs(x - sx) > 8 || Math.abs(y - sy) > 8)){ clearTimeout(timer); timer = null; }
    if (drag){ lastY = y; place(y); return true; }
    return false;
  };
  const up = () => { if (timer){ clearTimeout(timer); timer = null; } if (drag) finish(); };
  root.addEventListener('touchstart', e => { const t = e.touches[0]; if (down(e, t.clientX, t.clientY)) e.preventDefault(); }, { passive:false });
  root.addEventListener('touchmove', e => { const t = e.touches[0]; if (moveTo(t.clientX, t.clientY)) e.preventDefault(); }, { passive:false });
  root.addEventListener('touchend', up); root.addEventListener('touchcancel', up);
  root.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (down(e, e.clientX, e.clientY)) e.preventDefault();
    const mm = ev => moveTo(ev.clientX, ev.clientY);
    const mu = () => { up(); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  });
}
// 画面に並んだ順番どおりに、元のリストを並べ直す
function reorderBy(list, ids){ const m = new Map(list.map(x => [x.id, x])); const out = ids.map(id => m.get(id)).filter(Boolean); list.forEach(x => { if (!out.includes(x)) out.push(x); }); return out; }

function stamp(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function download(name, text, type){
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===== 画面「作品」（タブ：本文・あらすじ・人物・世界観・ネタ帳。左右スワイプで切り替え） ===== */
const TABS = [['body','本文'],['synopsis','あらすじ'],['chars','人物'],['world','世界観'],['ideas','ネタ帳']];
function renderWork(wid, tab){

    </div>
    <main id="pane"></main>`;
  bindUndo();

  const ttl = document.getElementById('wttl');
  ttl.addEventListener('input', () => { rec('wt:' + w.id); w.title = ttl.value.trim() || '無題の作品'; touch(w); saveSoon(); });
  $app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => switchTab(w, b.dataset.tab));
  const on = $app.querySelector('nav.tabs .on'); if (on) on.scrollIntoView({ inline:'center', block:'nearest' });
  moveInd(tabIndex(tab), 0, false);
  mountPane(w, tab, 0);
}
/* 枠を i 番目のタブへ。frac（-1〜1）を渡すと、隣のタブとの途中に置く（スワイプ中に指へ追従） */
function moveInd(i, frac, animate){
  const ind = $app.querySelector('.tab-ind'), bs = [...$app.querySelectorAll('nav.tabs [data-tab]')];
  if (!ind || !bs[i]) return;
  const j = Math.max(0, Math.min(bs.length - 1, i + Math.sign(frac))), f = Math.abs(frac);
  const a = bs[i], b = bs[j];
  const left = a.offsetLeft + (b.offsetLeft - a.offsetLeft) * f, width = a.offsetWidth + (b.offsetWidth - a.offsetWidth) * f;
  ind.classList.toggle('anim', !!animate);
  ind.style.transform = `translateX(${left}px)`; ind.style.width = width + 'px';
}
window.addEventListener('resize', () => { const t = document.getElementById('pane')?.dataset.tab; if (t) moveInd(tabIndex(t), 0, false); });
/* 部品「タブ切り替え」：画面全体は作り直さず、中身だけを横にスライドして入れ替える */
const PANES = { body:'paneBody', synopsis:'paneSynopsis', chars:'paneChars', world:'paneWorld', ideas:'paneIdeas' };
const tabIndex = t => TABS.findIndex(x => x[0] === t);
function mountPane(w, tab, dir){
  const old = document.getElementById('pane');
  const neu = document.createElement('main'); neu.id = 'pane'; neu.dataset.tab = tab;
  old.replaceWith(neu);
  window[PANES[tab]](w, neu);
  swipeTabs(neu, w, tab);
  if (dir){
    neu.style.transition = 'none';
    neu.style.transform = `translateX(${dir * 35}%)`; neu.style.opacity = '0.2';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      neu.style.transition = 'transform .22s cubic-bezier(.2,.7,.3,1), opacity .22s';
      neu.style.transform = ''; neu.style.opacity = '';
      setTimeout(() => { neu.style.transition = ''; }, 260);
    }));
  }
}
function switchTab(w, tab, dirOverride){
  const cur = document.getElementById('pane')?.dataset.tab;
  if (cur === tab) return;
  const dir = dirOverride || (tabIndex(tab) > tabIndex(cur) ? 1 : -1);
  const h = `#/w/${w.id}/${tab}`;
  history.replaceState(null, '', h); lastHash = h;
  $app.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  moveInd(tabIndex(tab), 0, true);
  const on = $app.querySelector('nav.tabs .on'); if (on) on.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
  window.scrollTo(0, 0);
  mountPane(w, tab, dir);
}
/* 部品「スワイプでタブ移動」：指に合わせて中身が動き、離すと隣のタブへ */
function swipeTabs(el, w, tab){
  let sx = 0, sy = 0, mode = null, dx = 0;
  const i = tabIndex(tab);
  el.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0;
    mode = (e.touches.length === 1 && !e.target.closest('.chips,.seg')) ? 'wait' : null;
  }, { passive:true });
  el.addEventListener('touchmove', e => {
    if (!mode || dragging) { mode = null; return; }
    const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if (mode === 'wait'){
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      mode = Math.abs(mx) > Math.abs(my) * 1.3 ? 'h' : null;
      if (!mode) return;
      el.style.transition = 'none';
    }
    e.preventDefault();
    dx = mx;
    const edge = (dx > 0 && i === 0) || (dx < 0 && i === TABS.length - 1);
    el.style.transform = `translateX(${edge ? dx * 0.25 : dx}px)`;
    el.style.opacity = String(1 - Math.min(Math.abs(dx) / innerWidth, 1) * 0.5);
    if (!edge) moveInd(i, Math.max(-1, Math.min(1, -dx / innerWidth)), false);
  }, { passive:false });
  const end = () => {
    if (mode !== 'h'){ mode = null; return; }
    mode = null;
    const j = i + (dx < 0 ? 1 : -1);
    if (Math.abs(dx) > innerWidth * 0.22 && j >= 0 && j < TABS.length){
      el.style.transition = 'transform .12s ease-in, opacity .12s';
      el.style.transform = `translateX(${dx < 0 ? -60 : 60}%)`; el.style.opacity = '0';
      setTimeout(() => switchTab(w, TABS[j][0], dx < 0 ? 1 : -1), 110);
    } else {
      el.style.transition = 'transform .18s ease-out, opacity .18s';
      el.style.transform = ''; el.style.opacity = '';
      moveInd(i, 0, true);
    }
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}

/* タブ「本文」：章と話 */
function paneBody(w, pane){
  const sel = selTags(w);
  if (sel.length){
    const hits = allEpisodes(w).filter(x => matchSel(x.e.tags, sel));

      <div class="hint"><span>${selNames(w)}が出る話：${hits.length} 話</span></div>
      <div class="card">${hits.map(({ c, e }) => epRow(w, e, c.title)).join('') || '<div class="empty">当てはまる話はありません</div>'}</div>`;
    bindChips(w, () => paneBody(w, pane)); bindEpRows(w, pane, () => paneBody(w, pane));
    return;
  }
  pane.innerHTML = `${chipBar(w)}
    <div class="hint"><span>合計 ${fmtN(workChars(w))} 字</span><span>長押しで並べ替え</span></div>
    <div id="chaps" class="sortbox">${w.chapters.map(c => `
      <div class="card chap" data-id="${c.id}">
        <div class="chap-head">
          <span class="grip" aria-label="章をつかんで移動">≡</span>
          <input data-ctitle="${c.id}" value="${esc(c.title)}" aria-label="章の名前">
          <span class="n">${c.episodes.length} 話</span>
          ${delBtn(`data-delc="${c.id}"`)}
        </div>
        <div class="sortbox eps" data-cid="${c.id}">${c.episodes.map(e => epRow(w, e)).join('')}</div>
        <button class="add" data-addep="${c.id}">＋ 話を追加</button>
      </div>`).join('')}</div>
    <button class="wide-btn" id="addChap">＋ 章を追加</button>`;
  const rerender = () => paneBody(w, pane);
  bindChips(w, rerender);
  bindEpRows(w, pane, rerender);
  document.getElementById('addChap').onclick = () => {
    rec(); w.chapters.push(newChapter(autoTitle(w.chapters, '章'))); touch(w); save(); rerender();
  };
  pane.querySelectorAll('[data-ctitle]').forEach(inp => inp.addEventListener('input', () => {
    rec('ct:' + inp.dataset.ctitle);
    const c = w.chapters.find(x => x.id === inp.dataset.ctitle); c.title = inp.value || '無題の章'; touch(w); saveSoon();
  }));
  pane.querySelectorAll('[data-addep]').forEach(b => b.onclick = () => {
    rec();
    const c = w.chapters.find(x => x.id === b.dataset.addep);
    const e = newEpisode(autoTitle(c.episodes, '話')); c.episodes.push(e); touch(w); save();
    go(`#/e/${w.id}/${e.id}`);
  });
  pane.querySelectorAll('[data-delc]').forEach(b => twoTap(b, () => {
    rec(); w.chapters = w.chapters.filter(x => x.id !== b.dataset.delc); touch(w); save(); rerender();
  }));
  const chaps = document.getElementById('chaps');
  // 話の並べ替え（章をまたいでもOK）
  sortable(chaps, { item:'.row', box:'.eps', onEnd:() => {
    const all = new Map(allEpisodes(w).map(x => [x.e.id, x.e]));
    chaps.querySelectorAll('.eps').forEach(bx => {
      const c = w.chapters.find(x => x.id === bx.dataset.cid);
      c.episodes = idsIn(bx, ':scope > .row').map(id => all.get(id)).filter(Boolean);
    });
    touch(w); save(); rerender();
  }});
  // 章の並べ替え（≡ をつかむ）
  sortable(chaps, { item:'.chap', box:'#chaps', handle:'.grip', onEnd:() => {
    w.chapters = reorderBy(w.chapters, idsIn(chaps, ':scope > .chap')); touch(w); save(); rerender();
  }});
}
function epRow(w, e, chapName){
  const n = w.ideas.filter(i => i.epIds.includes(e.id)).length;
  return `<div class="row" data-id="${e.id}">
    <button class="main" data-ep="${e.id}">
      <div class="t">${esc(e.title)}</div>
      <div class="m">${chapName ? `<span>${esc(chapName)}</span>` : ''}<span>${fmtN(count(e.body))} 字 ・ ${fmtDate(e.updatedAt)}</span>${n ? `<span>💡${n}</span>` : ''}${tagsHtml(w, e.tags)}</div>
    </button>
    <button class="act" data-etag="${e.id}" aria-label="タグを付ける">${I.tag}</button>
    ${delBtn(`data-dele="${e.id}"`)}
  </div>`;
}
function bindEpRows(w, pane, rerender){
  pane.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => go(`#/e/${w.id}/${b.dataset.ep}`));
  pane.querySelectorAll('[data-etag]').forEach(b => b.onclick = () => {
    const x = findEp(w, b.dataset.etag); tagSheet(w, x.e, () => { touch(w); save(); rerender(); });
  });
  pane.querySelectorAll('[data-dele]').forEach(b => twoTap(b, () => {
    const x = findEp(w, b.dataset.dele); rec(); x.c.episodes = x.c.episodes.filter(e => e !== x.e); touch(w); save(); rerender();
  }));
}

/* タブ「あらすじ」 */
function paneSynopsis(w, pane){
  pane.style.padding = '0'; pane.style.display = 'flex';
  pane.innerHTML = `<textarea class="body" id="syn" placeholder="物語全体のあらすじ、テーマ、結末の予定などを自由に書けます" style="min-height:calc(100dvh - 120px)">${esc(w.synopsis)}</textarea>`;
  const t = document.getElementById('syn');
  t.addEventListener('input', () => { rec('syn:' + w.id); w.synopsis = t.value; touch(w); saveSoon(); });
}

/* 登場数を数える小道具 */
const epCount = (w, id) => allEpisodes(w).filter(x => x.e.tags.includes(id)).length;
const ideaCount = (w, id) => w.ideas.filter(i => i.tags.includes(id)).length;

/* タブ「人物」 */
function paneChars(w, pane){
  pane.innerHTML = w.characters.length ? `
    <div class="hint"><span>${w.characters.length} 人</span><span>長押しで並べ替え</span></div>
    <div class="card"><div class="sortbox" id="clist">${w.characters.map(c => `
      <div class="row" data-id="${c.id}">
        <span class="avatar" style="background:${c.color}">${esc((c.name || '？')[0])}</span>
        <button class="main" data-c="${c.id}" style="padding-left:10px">
          <div class="t">${esc(c.name)}</div>
          <div class="m">${c.role ? `<span>${esc(c.role)}</span>` : ''}<span>登場 ${epCount(w, c.id)} 話 ・ ネタ ${ideaCount(w, c.id)}</span></div>
        </button>
        ${delBtn(`data-delch="${c.id}"`)}
      </div>`).join('')}</div></div>`
    : `<div class="empty">登場人物を追加すると、<br>その人物を話やネタに「タグ」として付けられます。</div>`;
  pane.insertAdjacentHTML('beforeend', `<button class="fab" id="addChar" aria-label="人物を追加">＋</button>`);
  pane.querySelectorAll('[data-c]').forEach(b => b.onclick = () => go(`#/c/${w.id}/${b.dataset.c}`));
  pane.querySelectorAll('[data-delch]').forEach(b => twoTap(b, () => { rec(); removeTag(w, b.dataset.delch); save(); paneChars(w, pane); }));
  document.getElementById('addChar').onclick = () => {
    rec();
    const c = { id:uid(), name:'新しい人物', role:'', color:COLORS[w.characters.length % COLORS.length], body:'' };
    w.characters.push(c); touch(w); save(); go(`#/c/${w.id}/${c.id}?new`);
  };
  const cl = document.getElementById('clist');
  if (cl) sortable(cl, { item:'.row', box:'#clist', onEnd:() => { w.characters = reorderBy(w.characters, idsIn(cl, ':scope > .row')); touch(w); save(); paneChars(w, pane); } });
}
/* 人物や世界観の項目を消すとき、話やネタに付いたそのタグも外す */
function removeTag(w, id){
  w.characters = w.characters.filter(x => x.id !== id);
  w.worldItems = w.worldItems.filter(x => x.id !== id);
  allEpisodes(w).forEach(x => x.e.tags = x.e.tags.filter(t => t !== id));
  w.ideas.forEach(i => i.tags = i.tags.filter(t => t !== id));
  touch(w);
}

/* タブ「世界観」：項目＝タグ。分類で絞り込み、並び順を切り替え */
const worldView = {};   // 作品ごとに { sort:'manual'|'cat'|'name', cat:null }
function paneWorld(w, pane){
  const v = worldView[w.id] = worldView[w.id] || { sort:'manual', cat:null };
  const cats = [...new Set(w.worldItems.map(x => x.cat.trim()).filter(Boolean))];
  if (v.cat && !cats.includes(v.cat)) v.cat = null;
  let list = w.worldItems.filter(x => !v.cat || x.cat.trim() === v.cat);
  if (v.sort === 'name') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'ja'));
  if (v.sort === 'cat') list = [...list].sort((a, b) => (a.cat || '￿').localeCompare(b.cat || '￿', 'ja') || a.title.localeCompare(b.title, 'ja'));
  const canSort = v.sort === 'manual' && !v.cat;
  const row = x => `<div class="row" data-id="${x.id}">
      <span class="avatar sq" style="background:${x.color}">${esc((x.title || '？')[0])}</span>
      <button class="main" data-x="${x.id}" style="padding-left:10px">
        <div class="t">${esc(x.title)}</div>
        <div class="m">${x.cat ? `<span>${esc(x.cat)}</span>` : ''}<span>登場 ${epCount(w, x.id)} 話 ・ ネタ ${ideaCount(w, x.id)}</span></div>
      </button>
      ${delBtn(`data-delx="${x.id}"`)}
    </div>`;
  let listHtml = '';
  if (v.sort === 'cat'){
    let cur = null;
    listHtml = list.map(x => { const c = x.cat.trim() || '分類なし'; const h = c !== cur ? `<div class="grp">${esc(c)}</div>` : ''; cur = c; return h + row(x); }).join('');
  } else listHtml = list.map(row).join('');
  pane.innerHTML = w.worldItems.length ? `
    ${cats.length ? `<div class="chips"><button class="chip ${!v.cat ? 'on' : ''}" data-cat="">すべて</button>${cats.map(c => `<button class="chip ${v.cat === c ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
    <div class="hint"><span>${list.length} 項目</span>
      <span class="seg">${[['manual','手動'],['cat','分類順'],['name','名前順']].map(([k, l]) => `<button data-sort="${k}" class="${v.sort === k ? 'on' : ''}">${l}</button>`).join('')}</span></div>
    <div class="card"><div class="sortbox" id="xlist">${listHtml}</div></div>
    ${canSort ? '<div class="hint"><span></span><span>長押しで並べ替え</span></div>' : ''}`
    : `<div class="empty">地名・組織・魔法のルールなど、<br>設定を項目ごとにまとめておけます。<br>項目は話やネタに「タグ」として付けられます。</div>`;
  pane.insertAdjacentHTML('beforeend', `<button class="fab" id="addX" aria-label="項目を追加">＋</button>`);
  pane.querySelectorAll('[data-x]').forEach(b => b.onclick = () => go(`#/x/${w.id}/${b.dataset.x}`));
  pane.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { v.cat = b.dataset.cat || null; paneWorld(w, pane); });
  pane.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { v.sort = b.dataset.sort; paneWorld(w, pane); });
  pane.querySelectorAll('[data-delx]').forEach(b => twoTap(b, () => { rec(); removeTag(w, b.dataset.delx); save(); paneWorld(w, pane); }));
  document.getElementById('addX').onclick = () => {
    rec();
    const x = { id:uid(), title:'新しい項目', cat:v.cat || '', color:COLORS[(w.worldItems.length + 4) % COLORS.length], body:'' };
    w.worldItems.push(x); touch(w); save(); go(`#/x/${w.id}/${x.id}?new`);
  };
  const xl = document.getElementById('xlist');
  if (xl && canSort) sortable(xl, { item:'.row', box:'#xlist', onEnd:() => { w.worldItems = reorderBy(w.worldItems, idsIn(xl, ':scope > .row')); touch(w); save(); paneWorld(w, pane); } });
}

/* タブ「ネタ帳」 */
let hideUsed = false;
function paneIdeas(w, pane){
  const sel = selTags(w);
  let list = w.ideas.filter(i => matchSel(i.tags, sel));
  if (hideUsed) list = list.filter(i => !i.used);
  const canSort = !sel.length && !hideUsed;
  pane.innerHTML = `
    <div class="quick"><textarea id="qtext" rows="2" placeholder="思いついたことをすぐメモ（例：終盤であの人物が裏切る）"></textarea><button id="qadd">追加</button></div>
    ${chipBar(w)}
    <div class="hint"><span>${list.length} 件${sel.length ? `（${selNames(w)}のタグ）` : ''}</span>
      <button class="link" id="hideUsed">${hideUsed ? '使ったネタも表示' : '使ったネタを隠す'}</button></div>
    ${list.length ? `<div class="card"><div class="sortbox" id="ilist">${list.map(i => `
      <div class="row ${i.used ? 'used' : ''}" data-id="${i.id}">
        <button class="main" data-i="${i.id}">
          <div class="pv" style="color:var(--ink);font-size:15px;margin-top:0;-webkit-line-clamp:3">${esc(i.text.trim()) || '（空のメモ）'}</div>
          <div class="m">${i.used ? '<span>✓ 使った</span>' : ''}${epLabel(w, i.epIds) ? `<span>📄 ${esc(epLabel(w, i.epIds))}</span>` : ''}<span>${fmtDate(i.createdAt)}</span>${tagsHtml(w, i.tags)}</div>
        </button>
        <button class="act" data-itag="${i.id}" aria-label="タグを付ける">${I.tag}</button>
        ${delBtn(`data-deli="${i.id}"`)}
      </div>`).join('')}</div></div>`
    : `<div class="empty">${sel.length || hideUsed ? '当てはまるネタはありません' : '「未来のこの話でこうしたい」などを、<br>ここにどんどん放り込めます。'}</div>`}`;
  const rerender = () => paneIdeas(w, pane);
  const q = document.getElementById('qtext');
  document.getElementById('qadd').onclick = () => {
    const t = q.value.trim(); if (!t) { q.focus(); return; }
    rec(); w.ideas.unshift({ id:uid(), text:t, tags:[...sel], used:false, epIds:[], createdAt:now() });
    touch(w); save(); rerender(); toast('ネタを追加しました');
  };
  document.getElementById('hideUsed').onclick = () => { hideUsed = !hideUsed; rerender(); };
  bindChips(w, rerender);
  pane.querySelectorAll('[data-i]').forEach(b => b.onclick = () => go(`#/i/${w.id}/${b.dataset.i}`));
  pane.querySelectorAll('[data-itag]').forEach(b => b.onclick = () => {
    const it = w.ideas.find(i => i.id === b.dataset.itag); tagSheet(w, it, () => { touch(w); save(); rerender(); });
  });
  pane.querySelectorAll('[data-deli]').forEach(b => twoTap(b, () => { rec(); w.ideas = w.ideas.filter(i => i.id !== b.dataset.deli); touch(w); save(); rerender(); }));
  const il = document.getElementById('ilist');
  if (il && canSort) sortable(il, { item:'.row', box:'#ilist', onEnd:() => { w.ideas = reorderBy(w.ideas, idsIn(il, ':scope > .row')); touch(w); save(); rerender(); } });
}

/* ===== 部品「書く画面」（話・人物・世界観・ネタ 共通） ===== */
function editorShell({ back, title, titlePh, fields, bodyText, bodyPh, foot }){
  $app.innerHTML = `
    <div class="editor">
      <header class="bar">
        <button class="ibtn" id="back" aria-label="戻る">${I.back}</button>
        ${title === null ? '<h1 style="font-size:16px">ネタ</h1>' : `<input class="ttl" id="ttl" value="${esc(title)}" placeholder="${titlePh}">`}
        <span class="status" id="status">✓</span>
        ${undoBtns()}
        <button class="ibtn del" id="delBtn" aria-label="削除">${I.x}</button>
      </header>
      ${fields || ''}
      <textarea class="body" id="body" placeholder="${bodyPh}" spellcheck="false">${esc(bodyText)}</textarea>
      <div class="foot">${foot}</div>
    </div>`;
  bindUndo();
  document.getElementById('back').onclick = () => { flushSave(); go(back); };
  return { body:document.getElementById('body'), ttl:document.getElementById('ttl'), del:document.getElementById('delBtn') };
}
function selectAllIfNew(inp){ if (inp && location.hash.endsWith('?new')){ inp.focus(); inp.select(); history.replaceState(null, '', location.hash.replace('?new', '')); } }
function keepCaret(body, pos){ if (pos != null){ try { body.focus(); body.setSelectionRange(pos, pos); } catch {} } }

/* 画面「本文」 */
function renderEpisode(wid, eid, caret){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const x = findEp(w, eid); if (!x){ go(`#/w/${wid}/body`); return; }
  const ep = x.e;
  const ideas = () => w.ideas.filter(i => i.epIds.includes(ep.id));
  const footHtml = () => `<button class="fbtn" id="tagBtn">${I.tag}${ep.tags.length || ''}</button>
    <button class="fbtn" id="ideaBtn">${I.idea}${ideas().length || ''}</button>
    <div class="grow">${tagsHtml(w, ep.tags)}</div><span id="cnt"></span>`;
  const { body, ttl, del } = editorShell({ back:`#/w/${wid}/body`, title:ep.title, titlePh:'話のタイトル',
    bodyText:ep.body, bodyPh:'ここに本文を書きます', foot:footHtml() });
  const foot = document.querySelector('.foot');
  const upd = () => { const c = document.getElementById('cnt'); if (c) c.textContent = `${fmtN(count(body.value))} 字`; };
  const bindFoot = () => {
    document.getElementById('tagBtn').onclick = () => tagSheet(w, ep, () => { touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); upd(); });
    document.getElementById('ideaBtn').onclick = () => {
      const list = ideas();
      sheet(`この話に結びついたネタ（${list.length}）`, [
        ...list.map(i => ({ label:(i.used ? '✓ ' : '') + i.text.trim().slice(0, 40), fn:() => go(`#/i/${wid}/${i.id}`) })),
        { label:'＋ この話用のネタを新しく作る', fn:() => {
          rec(); const it = { id:uid(), text:'', tags:[...ep.tags], used:false, epIds:[ep.id], createdAt:now() };
          w.ideas.unshift(it); touch(w); save(); go(`#/i/${wid}/${it.id}`);
        } },
      ], list.length ? null : 'ネタ帳のネタを開いて「📄」からこの話にチェックを付けると、ここに並びます。');
    };
  };
  bindFoot(); upd();
  body.addEventListener('input', () => { rec('ep:' + ep.id); ep.body = body.value; ep.updatedAt = now(); touch(w); upd(); saveSoon(); });
  ttl.addEventListener('input', () => { rec('et:' + ep.id); ep.title = ttl.value.trim() || '無題'; ep.updatedAt = now(); touch(w); saveSoon(); });
  twoTap(del, () => { rec(); x.c.episodes = x.c.episodes.filter(e => e !== ep); touch(w); save(); go(`#/w/${wid}/body`); });
  if (caret != null) keepCaret(body, caret); else if (!ep.body) body.focus();
}

/* 画面「人物」と「世界観の項目」（ほぼ同じ形） */
function renderTagItem(wid, id, kind){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const isChar = kind === 'c';
  const it = isChar ? charOf(w, id) : w.worldItems.find(x => x.id === id);
  const backTab = isChar ? 'chars' : 'world';
  if (!it){ go(`#/w/${wid}/${backTab}`); return; }
  const eps = allEpisodes(w).filter(x => x.e.tags.includes(id));
  const nIdeas = ideaCount(w, id);
  const nameKey = isChar ? 'name' : 'title';
  const { body, ttl, del } = editorShell({ back:`#/w/${wid}/${backTab}`, title:it[nameKey], titlePh:isChar ? '名前' : '項目名',
    fields:`<div class="fields">
      ${isChar ? `<label>役割など<input id="sub" value="${esc(it.role)}" placeholder="例：主人公／探索者／敵の幹部"></label>`
               : `<label>分類<input id="sub" value="${esc(it.cat)}" placeholder="例：地名／組織／魔法／歴史" list="cats"></label>
                  <datalist id="cats">${[...new Set(w.worldItems.map(x => x.cat).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>`}
      <label>色<span class="swatches">${COLORS.map(k => `<button class="sw ${k === it.color ? 'on' : ''}" data-col="${k}" style="background:${k};${isChar ? '' : 'border-radius:7px'}" aria-label="色"></button>`).join('')}</span></label>
    </div>`,
    bodyText:it.body, bodyPh:isChar ? '見た目、性格、口調、過去、ほかの人物との関係など、細かい設定を自由に' : '設定の中身を自由に',
    foot:`<button class="fbtn" id="seeEps">${I.page}登場する話 ${eps.length}</button><button class="fbtn" id="seeIdeas">${I.idea}ネタ ${nIdeas}</button>` });
  selectAllIfNew(ttl);
  body.addEventListener('input', () => { rec('tb:' + id); it.body = body.value; touch(w); saveSoon(); });
  ttl.addEventListener('input', () => { rec('tn:' + id); it[nameKey] = ttl.value.trim() || (isChar ? '名前なし' : '無題の項目'); touch(w); saveSoon(); });
  const sub = document.getElementById('sub');
  sub.addEventListener('input', () => { rec('ts:' + id); if (isChar) it.role = sub.value; else it.cat = sub.value; touch(w); saveSoon(); });
  document.querySelectorAll('[data-col]').forEach(b => b.onclick = () => {
    rec(); it.color = b.dataset.col; touch(w); save();
    document.querySelectorAll('[data-col]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('seeEps').onclick = () => {
    if (!eps.length){ toast('まだこのタグが付いた話はありません'); return; }
    sheet(`「${it[nameKey]}」が出る話`, eps.map(({ c, e }) => ({ label:`${c.title}　${e.title}`, fn:() => go(`#/e/${wid}/${e.id}`) })));
  };
  document.getElementById('seeIdeas').onclick = () => { filters[wid] = [id]; go(`#/w/${wid}/ideas`); };
  twoTap(del, () => { rec(); removeTag(w, id); save(); go(`#/w/${wid}/${backTab}`); });
}

/* 画面「ネタ」 */
function renderIdea(wid, iid, caret){
  const w = findWork(wid); if (!w){ go('#/'); return; }
  const it = w.ideas.find(i => i.id === iid); if (!it){ go(`#/w/${wid}/ideas`); return; }
  const footHtml = () => `<button class="fbtn" id="tagBtn">${I.tag}${it.tags.length || ''}</button>
    <button class="fbtn" id="epBtn" style="max-width:40%;overflow:hidden;text-overflow:ellipsis">${I.page}${esc(epLabel(w, it.epIds) || '話')}</button>
    <div class="grow">${tagsHtml(w, it.tags)}</div><button class="fbtn ${it.used ? 'on' : ''}" id="usedBtn">${it.used ? '✓ 使った' : '使った'}</button>`;
  const { body, del } = editorShell({ back:`#/w/${wid}/ideas`, title:null, bodyText:it.text, bodyPh:'ネタの中身', foot:footHtml() });
  const foot = document.querySelector('.foot');
  const bindFoot = () => {
    document.getElementById('tagBtn').onclick = () => tagSheet(w, it, () => { touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); });
    document.getElementById('usedBtn').onclick = () => { rec(); it.used = !it.used; touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); };
    document.getElementById('epBtn').onclick = () => epSheet(w, it, () => { touch(w); save(); foot.innerHTML = footHtml(); bindFoot(); });
  };
  bindFoot();
  body.addEventListener('input', () => { rec('id:' + it.id); it.text = body.value; touch(w); saveSoon(); });
  twoTap(del, () => { rec(); w.ideas = w.ideas.filter(y => y !== it); touch(w); save(); go(`#/w/${wid}/ideas`); });
  if (caret != null) keepCaret(body, caret); else if (!it.text) body.focus();
}

/* ===== 画面の切り替え（スマホの「戻る」でも戻れる） ===== */
function route(keep){
  flushSave();
  const ta = document.getElementById('body'), caret = keep && ta ? ta.selectionStart : null, sy = window.scrollY;
  document.querySelectorAll('.sheet-bg,.ghost').forEach(x => x.remove());
  const h = location.hash.replace(/\?.*$/, ''), p = h.replace(/^#\/?/, '').split('/');
  const same = h === lastHash; lastHash = h;
  if (p[0] === 'w' && p[1]) renderWork(p[1], p[2]);
  else if (p[0] === 'e' && p[2]) renderEpisode(p[1], p[2], caret);
  else if (p[0] === 'c' && p[2]) renderTagItem(p[1], p[2], 'c');
  else if (p[0] === 'x' && p[2]) renderTagItem(p[1], p[2], 'x');
  else if (p[0] === 'i' && p[2]) renderIdea(p[1], p[2], caret);
  else renderHome();
  window.scrollTo(0, same ? sy : 0);
}
window.addEventListener('hashchange', () => route());

(async () => {
  try { data = await dbGet('data'); } catch (e) { alert('データを読み込めませんでした：' + e); }
  const wasOld = data && data.version !== 4;
  data = migrate(data);
  if (wasOld) await save();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  route();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
